name: CI

on:
  push:
    branches: [main]
    paths:
      - 'myfinance/**'
  pull_request:
    branches: [main]
    paths:
      - 'myfinance/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myfinance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: myfinance/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
