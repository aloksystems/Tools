<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#2f4a76">
    <title>PDF Preview Remover (JS - Fixed!)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <script src="../theme-init.js"></script>
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../premium-theme.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-eye"></i> PDF Preview Remover</h1>
            <p>Load PDF, preview pages, check to delete, remove & download!</p>
        </header>
        <div class="content">
            <div id="dropZone">
                <i class="fas fa-cloud-upload-alt" style="font-size: 3em; color: var(--primary);"></i>
                <p>Drop PDF here or click to browse</p>
            </div>
            <input type="file" id="fileInput" accept=".pdf">
            <div id="info"></div>
            <div id="previewContainer"></div>
            <div>
                <label>Output: (Auto-downloads to your Downloads folder)</label>
                <input type="text" id="outputFolder" placeholder="Browser auto-save" disabled>
            </div>
            <button id="removeBtn" onclick="removeSelected()" disabled><i class="fas fa-scissors"></i> Remove Selected &
                Download</button>
        </div>
    </div>

    
    <script src="../tool-registry.js"></script>
    <script src="../premium-ui.js"></script>
    <script src="script.js"></script>
</body>

</html>
