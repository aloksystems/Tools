<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#2f4a76">
    <title>Images to PDF (JS Edition)</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <script src="../theme-init.js"></script>
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../premium-theme.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../back.css">
    <script src="../../back.js" defer></script>

    <meta name="description" content="Use Images to PDF (JS Edition) online for free. Fast, private, and browser-based with no installation required.">
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
    <link rel="canonical" href="https://aloksystems.freedev.app/PDF-Tools/JPG-to-PDF/">
    <meta property="og:title" content="Images to PDF (JS Edition)">
    <meta property="og:description" content="Use Images to PDF (JS Edition) online for free. Fast, private, and browser-based with no installation required.">
    <meta property="og:url" content="https://aloksystems.freedev.app/PDF-Tools/JPG-to-PDF/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Alok Systems Tools">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Images to PDF (JS Edition)">
    <meta name="twitter:description" content="Use Images to PDF (JS Edition) online for free. Fast, private, and browser-based with no installation required.">
    <meta name="author" content="Alok Systems">    <script type="application/ld+json">
{
    "@context":  "https://schema.org",
    "@type":  "WebApplication",
    "name":  "Images to PDF (JS Edition)",
    "description":  "Use Images to PDF (JS Edition) online for free. Fast, private, and browser-based with no installation required.",
    "url":  "https://aloksystems.freedev.app/PDF-Tools/JPG-to-PDF/",
    "applicationCategory":  "UtilityApplication",
    "operatingSystem":  "Any"
}
    </script>
</head>

<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-images"></i> Images to PDF</h1>
            <p>Convert JPG/PNG images into a multi-page PDF in seconds.</p>
        </header>
        <div class="content">
            <div id="dropZone">
                <i class="fas fa-cloud-upload-alt"></i>
                <span>Drop your images here or click to browse (multiple OK!)</span>
                <small>Supports JPG and PNG files.</small>
            </div>
            <input type="file" id="fileInput" accept="image/jpeg,image/png" multiple>

            <div id="fileList"></div>

            <div class="btn-group">
                <button onclick="addFiles()"><i class="fas fa-plus"></i> Add Images</button>
                <button onclick="clearList()"><i class="fas fa-trash"></i> Clear List</button>
            </div>

            <div id="info"></div>

            <label>Output: (Downloads 'images_to_pdf_*.pdf')</label>
            <input type="text" placeholder="Auto-downloads to Downloads" disabled>

            <button id="convertBtn" onclick="convertToPDF()" disabled>
                <i class="fas fa-file-pdf"></i> Convert to PDF
            </button>
        </div>
    </div>
    
    <script src="../tool-registry.js"></script>
    <script src="../premium-ui.js"></script>
    <script src="script.js"></script>
</body>

</html>
