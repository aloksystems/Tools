<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#2f4a76">
    <title>PDF Rotator (JS Edition)</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <script src="../theme-init.js"></script>
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../premium-theme.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-sync-alt"></i> PDF Rotator</h1>
            <p>Rotate PDF pages by 90Â°, 180Â°, or 270Â° and download instantly.</p>
        </header>
        <div class="content">
            <label for="fileInput">
                <div id="dropZone">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span>Drop your PDF here or click to browse</span>
                    <small>Rotate any or all pages in seconds.</small>
                    <div id="fileName"></div>
                </div>
            </label>
            <input type="file" id="fileInput" accept=".pdf">

            <div id="info"></div>

            <label>Pages to Rotate: (e.g., all, 1-5,10)</label>
            <input type="text" id="pageRange" placeholder="all">

            <label>Rotation Angle:</label>
            <div class="angle-group">
                <button class="active" data-angle="90">90Â°</button>
                <button data-angle="180">180Â°</button>
                <button data-angle="270">270Â°</button>
            </div>

            <label>Output: (Downloads 'rotated_*.pdf')</label>
            <input type="text" placeholder="Auto-downloads to Downloads" disabled>

            <button id="rotateBtn" onclick="rotatePDF()" disabled>
                <i class="fas fa-redo"></i> Rotate PDF
            </button>
        </div>
    </div>
    
    <script src="../tool-registry.js"></script>
    <script src="../premium-ui.js"></script>
    <script src="script.js"></script>
</body>

</html>
