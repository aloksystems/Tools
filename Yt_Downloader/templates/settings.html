<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#10131e"/>
<link rel="manifest" href="/static/manifest.webmanifest"/>
<link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml"/>
<script src="/static/js/api.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode: "class", theme: { extend: {
  colors: {
    primary: "#d0bcff", "primary-container": "#a078ff", "on-primary": "#3c0091", "on-primary-container": "#340080",
    secondary: "#4edea3", "secondary-container": "#00a572", "on-secondary": "#003824",
    background: "#10131e", surface: "#10131e", "on-surface": "#e0e1f1", "on-surface-variant": "#cbc3d7",
    "surface-container": "#1c1f2b", "surface-container-high": "#272935", "surface-container-highest": "#313440",
    "surface-container-lowest": "#0b0e18", outline: "#958ea0", error: "#ffb4ab"
  },
  borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
  spacing: { "space-xs": "0.25rem", "space-sm": "0.5rem", "space-md": "1rem", "space-lg": "1.5rem",
    gutter: "1rem", "gutter-lg": "1.5rem" },
  fontFamily: { "label-code": ["JetBrains Mono"], "body-md": ["Inter"], "headline-md": ["Geist"],
    "label-md": ["Inter"], "label-mono-sm": ["JetBrains Mono"], "body-sm": ["Inter"] },
  fontSize: { "label-code": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "500" }],
    "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
    "headline-md": ["20px", { lineHeight: "26px", letterSpacing: "-0.01em", fontWeight: "500" }],
    "label-md": ["13px", { lineHeight: "16px", fontWeight: "500" }],
    "label-mono-sm": ["11px", { lineHeight: "14px", fontWeight: "400" }] }
} } }
</script>
<style>
  html, body { width: 100vw; margin: 0; padding: 0; background-color: #10131e; color: #e0e1f1; }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom,0px); }
  .pt-safe { padding-top: env(safe-area-inset-top,0px); }
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen">

<header class="fixed top-0 w-full z-50 bg-surface-container-lowest/85 backdrop-blur-xl pt-safe shadow-[0_1px_12px_rgba(0,0,0,0.4)]">
  <div class="h-16 px-gutter flex items-center justify-between">
    <div class="flex items-center gap-space-sm">
      <div class="w-8 h-8 rounded-lg bg-primary-container flex items-center justify-center">
        <span class="material-symbols-outlined text-on-primary text-[20px]">settings</span>
      </div>
      <span class="font-headline-md text-headline-md text-on-surface font-semibold tracking-tight">Settings</span>
    </div>
  </div>
</header>

<main class="flex-1 flex flex-col relative w-full pt-20 pb-28 bg-surface">
  <div class="flex flex-col w-full px-gutter py-space-sm space-y-space-lg">

    <section class="space-y-space-md">
      <span class="font-label-code text-label-code text-on-surface-variant uppercase tracking-wider">Download Defaults</span>
      <div class="bg-surface-container rounded-xl p-space-md space-y-4 shadow-lg">
        <div>
          <label class="font-label-md text-label-md text-on-surface block mb-1.5">Default Format</label>
          <select id="setting-format" class="w-full bg-surface-container-lowest rounded-lg px-3 py-2.5 text-on-surface font-body-md text-body-md border border-outline-variant focus:outline-none">
            <option value="video">Video (MP4 / MKV)</option>
            <option value="audio">Audio (MP3)</option>
          </select>
        </div>
        <div>
          <label class="font-label-md text-label-md text-on-surface block mb-1.5">Default Quality</label>
          <select id="setting-quality" class="w-full bg-surface-container-lowest rounded-lg px-3 py-2.5 text-on-surface font-body-md text-body-md border border-outline-variant focus:outline-none">
            <option value="best">Best available</option>
            <option value="2160p">4K (2160p)</option>
            <option value="1080p">1080p</option>
            <option value="720p">720p</option>
            <option value="480p">480p</option>
            <option value="360p">360p</option>
          </select>
        </div>
        <div>
          <label class="font-label-md text-label-md text-on-surface block mb-1.5">Save Location</label>
          <input id="setting-dir" type="text" placeholder="Default: ~/Downloads/YouTube"
                 class="w-full bg-surface-container-lowest rounded-lg px-3 py-2.5 text-on-surface font-body-md text-body-md border border-outline-variant focus:outline-none"/>
        </div>
        <div class="flex items-center justify-between">
          <span class="font-label-md text-label-md text-on-surface">Save subtitles (English)</span>
          <input id="setting-subtitles" type="checkbox" class="w-5 h-5 accent-[#d0bcff]"/>
        </div>
        <div class="flex items-center justify-between">
          <span class="font-label-md text-label-md text-on-surface">Embed thumbnail &amp; metadata</span>
          <input id="setting-thumbnail" type="checkbox" class="w-5 h-5 accent-[#d0bcff]"/>
        </div>
      </div>
    </section>

    <section class="space-y-space-md">
      <span class="font-label-code text-label-code text-on-surface-variant uppercase tracking-wider">Connection</span>
      <div class="bg-surface-container rounded-xl p-space-md space-y-4 shadow-lg">
        <div>
          <label class="font-label-md text-label-md text-on-surface block mb-1.5">Backend Server URL</label>
          <input id="setting-server-url" type="text" placeholder="e.g. http://192.168.1.10:5001 (empty = same server)"
                 class="w-full bg-surface-container-lowest rounded-lg px-3 py-2.5 text-on-surface font-body-md text-body-md border border-outline-variant focus:outline-none"/>
          <p class="mt-1.5 text-secondary font-body-sm text-body-sm">App for the mobile app. Point it at the PC running the backend; leave empty on web/desktop.</p>
        </div>
      </div>
    </section>

    <button id="save-btn" class="w-full flex items-center justify-center gap-2 py-3 px-4 rounded-lg bg-primary hover:bg-tertiary-container active:scale-[0.98] text-on-primary font-headline-md text-body-lg font-semibold transition-all shadow-md" type="button">
      <span class="material-symbols-outlined text-[20px]">save</span><span>Save Settings</span>
    </button>
    <p id="save-note" class="hidden text-secondary text-center font-body-sm text-body-sm"></p>

  </div>
</main>

<nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-2px_16px_rgba(0,0,0,0.5)]">
  <div class="flex justify-around items-center h-16 px-gutter">
    <a class="flex flex-col items-center justify-center gap-0.5 min-w-[56px] min-h-[44px] text-on-surface-variant hover:text-on-surface" href="/">
      <span class="material-symbols-outlined text-[22px]">download</span><span class="font-label-md text-label-md">Home</span>
    </a>
    <a class="flex flex-col items-center justify-center gap-0.5 min-w-[56px] min-h-[44px] text-on-surface-variant hover:text-on-surface" href="/downloads">
      <span class="material-symbols-outlined text-[22px]">sync</span><span class="font-label-md text-label-md">Downloads</span>
    </a>
    <a class="flex flex-col items-center justify-center gap-0.5 min-w-[56px] min-h-[44px] text-on-surface-variant hover:text-on-surface" href="/history">
      <span class="material-symbols-outlined text-[22px]">history</span><span class="font-label-md text-label-md">History</span>
    </a>
    <a class="flex flex-col items-center justify-center gap-0.5 min-w-[56px] min-h-[44px] text-primary font-semibold" href="/settings">
      <span class="material-symbols-outlined text-[22px]">settings</span><span class="font-label-md text-label-md">Settings</span>
    </a>
  </div>
</nav>

<script>
(function initSettings() {
  const $ = (id) => document.getElementById(id);
  const note = $('save-note');

  async function load() {
    const res = await fetch(apiUrl('/api/settings'));
    const data = await res.json();
    const s = data.settings || {};
    $('setting-format').value = s.default_format || 'video';
    $('setting-quality').value = s.default_quality || 'best';
    $('setting-dir').value = s.default_output_dir || '';
    $('setting-subtitles').checked = !!s.subtitles;
    $('setting-thumbnail').checked = !!s.thumbnail;
    $('setting-server-url').value = (localStorage.getItem('ytdl_server_url') || '');
  }

  $('save-btn').addEventListener('click', async () => {
    const payload = {
      default_format: $('setting-format').value,
      default_quality: $('setting-quality').value,
      default_output_dir: $('setting-dir').value.trim(),
      subtitles: $('setting-subtitles').checked,
      thumbnail: $('setting-thumbnail').checked,
    };
    try {
      const res = await fetch(apiUrl('/api/settings'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!data.ok) throw new Error('Save failed');
      const serverUrl = $('setting-server-url').value.trim();
      if (serverUrl && !/^https?:\/\//i.test(serverUrl)) throw new Error('Server URL must start with http:// or https://');
      try {
        localStorage.setItem('ytdl_server_url', serverUrl);
        window.APP_API_BASE = serverUrl ? serverUrl.replace(/\/+$/, '') : '';
      } catch (e) { throw new Error('Could not save server URL (storage unavailable)'); }
      note.textContent = 'Settings saved.'; note.classList.remove('hidden');
      setTimeout(() => note.classList.add('hidden'), 2000);
    } catch (e) {
      note.textContent = e.message; note.classList.remove('hidden');
      note.classList.remove('text-secondary'); note.classList.add('text-error');
    }
  });

  load();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/static/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
