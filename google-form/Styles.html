<style>
/* FormForge design system — minimal, premium, neutral + restrained indigo accent */
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --muted: #64748b;
  --muted-2: #94a3b8;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-soft: #eef2ff;
  --success: #15803d;
  --success-bg: #f0fdf4;
  --success-border: #bbf7d0;
  --warning: #b45309;
  --warning-bg: #fffbeb;
  --warning-border: #fde68a;
  --danger: #dc2626;
  --danger-bg: #fef2f2;
  --danger-border: #fecaca;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.06);
  --shadow-lg: 0 12px 40px rgba(15,23,42,.14);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font); background: var(--bg); color: var(--text);
  font-size: 15px; line-height: 1.55;
}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Header */
.ff-header {
  position: sticky; top: 0; z-index: 20;
  background: rgba(255,255,255,.9); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.ff-header-inner {
  max-width: 1240px; margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; gap: 14px;
}
.ff-logo { width: 36px; height: 36px; border-radius: 10px; background: var(--text);
  color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; }
.ff-brand h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
.ff-brand p { margin: 0; font-size: 12.5px; color: var(--muted); }
.ff-header-spacer { flex: 1; }
.ff-auth {
  display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
  border: 1px solid var(--border); background: var(--surface); padding: 6px 12px; border-radius: 999px;
  max-width: 320px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.ff-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted-2); flex: none; }
.ff-dot.ok { background: #22c55e; }
.ff-btn {
  appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font: inherit; font-size: 13.5px; font-weight: 600; padding: 8px 14px; border-radius: 9px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  transition: background .15s, border-color .15s, transform .05s;
}
.ff-btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
.ff-btn:active { transform: translateY(1px); }
.ff-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.ff-btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.ff-btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.ff-btn-sm { padding: 6px 10px; font-size: 12.5px; border-radius: 8px; }
.ff-btn svg { width: 15px; height: 15px; }

/* Layout */
.ff-wrap { max-width: 1240px; margin: 0 auto; padding: 28px 20px 60px; }
.ff-title { font-size: 28px; letter-spacing: -.02em; margin: 0 0 6px; }
.ff-subtitle { color: var(--muted); margin: 0 0 20px; max-width: 720px; }
.ff-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 18px; align-items: start; }
@media (max-width: 980px) { .ff-grid { grid-template-columns: 1fr; } }
.ff-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.ff-card-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.ff-card-head h2 { font-size: 14px; margin: 0; }
.ff-card-head p { font-size: 12.5px; color: var(--muted); margin: 0; }
.ff-card-body { padding: 16px 18px; }
.ff-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.ff-editor {
  width: 100%; min-height: 420px; resize: vertical; font-family: var(--mono); font-size: 12.8px; line-height: 1.6;
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; background: #0f172a; color: #e2e8f0;
}
.ff-editor:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.ff-status { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; border-radius: var(--radius-sm);
  padding: 10px 12px; margin-top: 12px; border: 1px solid var(--border); background: var(--surface-2); }
.ff-status.ok { background: var(--success-bg); border-color: var(--success-border); color: #14532d; }
.ff-status.err { background: var(--danger-bg); border-color: var(--danger-border); color: #7f1d1d; }
.ff-status.warn { background: var(--warning-bg); border-color: var(--warning-border); color: #78350f; }
.ff-errors { margin: 10px 0 0; padding: 0; list-style: none; max-height: 220px; overflow: auto; font-size: 12.8px; }
.ff-errors li { padding: 7px 10px; border: 1px solid var(--danger-border); background: #fff; border-radius: 7px; margin-bottom: 6px; }
.ff-errors code { font-family: var(--mono); font-size: 11.5px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

/* Preview */
.ff-preview-meta { display: grid; gap: 10px; margin-bottom: 14px; }
.ff-field label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 4px; }
.ff-field input[type=text], .ff-field textarea, .ff-field select {
  width: 100%; font: inherit; font-size: 13.5px; padding: 9px 11px; border: 1px solid var(--border);
  border-radius: 8px; background: #fff; color: var(--text);
}
.ff-field textarea { min-height: 56px; resize: vertical; }
.ff-settings { display: flex; flex-wrap: wrap; gap: 10px 18px; border: 1px dashed var(--border-strong);
  border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; font-size: 13px; }
.ff-check { display: flex; align-items: center; gap: 7px; cursor: pointer; }
.ff-q { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fff; }
.ff-q-top { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.ff-q-num { font-size: 11px; font-weight: 800; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 2px 7px; color: var(--muted); }
.ff-q-type { margin-left: auto; font-size: 12px; border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; font: inherit; background: #fff; }
.ff-q input[type=text], .ff-q textarea { width: 100%; font: inherit; font-size: 13.5px; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 7px; margin-bottom: 7px; }
.ff-q textarea { min-height: 40px; resize: vertical; font-size: 12.8px; color: var(--muted); }
.ff-opts { display: grid; gap: 6px; margin: 6px 0; }
.ff-opt { display: flex; gap: 7px; align-items: center; }
.ff-opt input { flex: 1; margin: 0 !important; }
.ff-icon-btn { border: 1px solid var(--border); background: #fff; border-radius: 7px; width: 28px; height: 28px;
  display: inline-grid; place-items: center; cursor: pointer; color: var(--muted); font-size: 14px; line-height: 1; flex: none; }
.ff-icon-btn:hover { background: var(--surface-2); color: var(--text); }
.ff-icon-btn.danger:hover { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
.ff-q-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.ff-req { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.ff-scale-row { display: flex; gap: 8px; flex-wrap: wrap; }
.ff-scale-row .ff-field { flex: 1; min-width: 110px; }
.ff-add-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.ff-generate-bar { position: sticky; bottom: 0; padding: 12px 0 4px; background: linear-gradient(transparent, var(--bg) 30%); }
.ff-generate-bar .ff-btn-primary { width: 100%; justify-content: center; padding: 13px; font-size: 15px; border-radius: 11px; }
.ff-hint { font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 8px; }

/* Result */
.ff-result { border: 1px solid var(--success-border); background: var(--success-bg); border-radius: var(--radius);
  padding: 20px; margin-top: 18px; box-shadow: var(--shadow); }
.ff-result.partial { background: var(--warning-bg); border-color: var(--warning-border); }
.ff-result.failed { background: var(--danger-bg); border-color: var(--danger-border); }
.ff-result h3 { margin: 0 0 6px; font-size: 17px; }
.ff-links { display: grid; gap: 10px; margin-top: 12px; }
.ff-link-row { background: #fff; border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px;
  display: flex; gap: 10px; align-items: center; }
.ff-link-row strong { font-size: 12.5px; display: block; }
.ff-link-row a { font-size: 12.5px; word-break: break-all; }
.ff-link-row .ff-btn { margin-left: auto; flex: none; }

/* How-to */
.ff-howto { margin-top: 26px; }
.ff-howto ol { margin: 8px 0; padding-left: 20px; }
.ff-howto li { margin-bottom: 6px; }
.ff-prompt-box { background: #0f172a; color: #e2e8f0; border-radius: 10px; padding: 14px; font-family: var(--mono);
  font-size: 12px; line-height: 1.6; white-space: pre-wrap; max-height: 260px; overflow: auto; margin-top: 10px; }
.ff-footer { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 30px; }

/* Modal + toast */
.ff-modal-back { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; place-items: center; z-index: 50; padding: 16px; }
.ff-modal-back.open { display: grid; }
.ff-modal { background: #fff; border-radius: 14px; max-width: 560px; width: 100%; box-shadow: var(--shadow-lg);
  max-height: 85vh; overflow: auto; }
.ff-modal head, .ff-modal-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.ff-modal-head h3 { margin: 0; font-size: 16px; }
.ff-modal-body { padding: 16px 20px; font-size: 14px; }
#ffToast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px); background: #0f172a;
  color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13.5px; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; z-index: 60; max-width: min(92vw, 520px); text-align: center; }
#ffToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.ff-spinner { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
  border-radius: 50%; animation: ffspin .7s linear infinite; display: inline-block; }
@keyframes ffspin { to { transform: rotate(360deg); } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
.ff-empty { border: 1px dashed var(--border-strong); border-radius: 10px; padding: 22px; text-align: center;
  color: var(--muted); font-size: 13.5px; }
@media (max-width: 640px) {
  .ff-wrap { padding: 18px 12px 50px; }
  .ff-title { font-size: 22px; }
  .ff-card-body { padding: 12px; }
  .ff-editor { min-height: 300px; }
  .ff-auth span { display: none; }
}
</style>
