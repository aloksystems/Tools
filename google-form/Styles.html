<style>
/* ===== FormForge — Styles.html =====
   Teal design system shared with the Alok Systems Tools site.
   Light + dark tokens, app bar, workspace cards, editor, preview, FAQ. */

:root {
  color-scheme: light;
  --page: #f8fafc;
  --surface: #ffffff;
  --surface-soft: #f1f5f9;
  --text: #0f172a;
  --muted: #64748b;
  --subtle: #94a3b8;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --brand: #14b8a6;
  --brand-strong: #0d9488;
  --brand-deep: #0f766e;
  --brand-soft: rgba(20, 184, 166, .09);
  --brand-ring: rgba(20, 184, 166, .22);
  --ok: #15803d;
  --ok-bg: #f0fdf4;
  --ok-line: #bbf7d0;
  --warn: #b45309;
  --warn-bg: #fffbeb;
  --warn-line: #fde68a;
  --danger: #b91c1c;
  --danger-bg: #fef2f2;
  --danger-line: #fecaca;
  --shadow: 0 8px 26px rgba(15, 23, 42, .06);
  --shadow-lg: 0 26px 60px -20px rgba(15, 23, 42, .35);
  --radius: 18px;
  --radius-sm: 11px;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --ease: cubic-bezier(.22, .61, .36, 1);
}

html[data-theme="dark"] {
  color-scheme: dark;
  --page: #0b1120;
  --surface: #101a2e;
  --surface-soft: #16223a;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --subtle: #7c8aa0;
  --line: #26354a;
  --line-strong: #334155;
  --brand: #2dd4bf;
  --brand-strong: #14b8a6;
  --brand-deep: #2dd4bf;
  --brand-soft: rgba(45, 212, 191, .1);
  --brand-ring: rgba(45, 212, 191, .3);
  --ok: #86efac;
  --ok-bg: #12261f;
  --ok-line: #14532d;
  --warn: #fde68a;
  --warn-bg: #2a2113;
  --warn-line: #70511b;
  --danger: #fecaca;
  --danger-bg: #351c27;
  --danger-line: #7f1d1d;
  --shadow: 0 8px 26px rgba(0, 0, 0, .2);
  --shadow-lg: 0 26px 60px -20px rgba(0, 0, 0, .55);
}

*,
*::before,
*::after { box-sizing: border-box; }

[hidden] { display: none !important; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  min-width: 320px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  display: flex;
  flex-direction: column;
  background: var(--page);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, p { margin: 0; }
a { color: var(--brand-strong); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; }

:focus-visible {
  outline: 3px solid var(--brand-ring);
  outline-offset: 2px;
  border-radius: 6px;
}

.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
}

.ff-skip {
  position: absolute;
  left: 12px;
  top: -60px;
  z-index: 100;
  padding: 9px 14px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text);
  font-size: .82rem;
  font-weight: 700;
  text-decoration: none;
}
.ff-skip:focus { top: 10px; }

/* ===== App bar ===== */
.ff-appbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  border-bottom: 1px solid var(--line);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}

.ff-appbar-inner {
  width: min(100% - 48px, 1180px);
  margin: 0 auto;
  min-height: 68px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.ff-brand {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  color: var(--text);
  text-decoration: none;
  min-width: 0;
}

.ff-brand-mark {
  width: 38px;
  height: 38px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: linear-gradient(135deg, var(--brand-deep), var(--brand));
  color: #fff;
  font-size: 1rem;
  font-weight: 800;
  box-shadow: 0 8px 20px -8px rgba(20, 184, 166, .55);
}

.ff-brand-copy { display: grid; line-height: 1.15; min-width: 0; }
.ff-brand-copy strong { font-size: .95rem; font-weight: 800; letter-spacing: -.01em; }
.ff-brand-copy small { color: var(--muted); font-size: .72rem; font-weight: 600; }

.ff-appbar-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.ff-account {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  max-width: 280px;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  font-size: .76rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
}
.ff-account span:not(.ff-dot) {
  overflow: hidden;
  text-overflow: ellipsis;
}

.ff-dot {
  width: 8px;
  height: 8px;
  flex: none;
  border-radius: 50%;
  background: var(--subtle);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--subtle) 18%, transparent);
}
.ff-dot.ok { background: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

.ff-tools-link {
  color: var(--muted);
  font-size: .8rem;
  font-weight: 700;
  text-decoration: none;
  padding: 7px 10px;
  border-radius: 9px;
}
.ff-tools-link:hover { background: var(--brand-soft); color: var(--brand-strong); }

/* ===== Buttons ===== */
.ff-btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 36px;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  color: var(--text);
  font-size: .8rem;
  font-weight: 650;
  line-height: 1;
  text-decoration: none;
  transition: background .15s var(--ease), border-color .15s var(--ease), transform .06s var(--ease);
}
.ff-btn:hover { background: var(--surface-soft); border-color: var(--line-strong); }
.ff-btn:active { transform: translateY(1px); }
.ff-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.ff-btn-primary {
  background: linear-gradient(135deg, var(--brand-deep), var(--brand));
  border-color: transparent;
  color: #fff;
  box-shadow: 0 10px 22px -14px rgba(13, 148, 136, .9);
}
.ff-btn-primary:hover { filter: brightness(1.04); background: linear-gradient(135deg, var(--brand-deep), var(--brand)); border-color: transparent; }
html[data-theme="dark"] .ff-btn-primary { color: #04211e; }

.ff-btn-sm { min-height: 32px; padding: 0 10px; font-size: .76rem; border-radius: 9px; }

.ff-btn-danger-ghost { color: var(--danger); }
.ff-btn-danger-ghost:hover { background: var(--danger-bg); border-color: var(--danger-line); }

.ff-icon-btn {
  width: 32px;
  height: 32px;
  flex: none;
  display: inline-grid;
  place-items: center;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
  color: var(--muted);
  font-size: .9rem;
  line-height: 1;
}
.ff-icon-btn:hover { background: var(--surface-soft); color: var(--text); border-color: var(--line-strong); }
.ff-icon-btn.danger:hover { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-line); }

/* ===== Layout / hero ===== */
.ff-wrap {
  width: min(100% - 48px, 1180px);
  margin: 0 auto;
  flex: 1;
  padding: 38px 0 64px;
}

.ff-hero {
  max-width: 800px;
  margin: 0 auto 30px;
  text-align: center;
}

.ff-eyebrow {
  margin-bottom: 8px;
  color: var(--brand-deep);
  font-size: .72rem;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.ff-title {
  margin-bottom: 10px;
  font-size: clamp(1.8rem, 3.6vw, 2.5rem);
  font-weight: 800;
  line-height: 1.12;
  letter-spacing: -.04em;
  text-wrap: balance;
}

.ff-subtitle {
  max-width: 640px;
  margin: 0 auto;
  color: var(--muted);
  font-size: .98rem;
}

.ff-hero-actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}

.ff-chip-row {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}

.ff-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  font-size: .74rem;
  font-weight: 600;
}
.ff-chip b { color: var(--brand-deep); font-weight: 800; }

/* ===== Workspace grid ===== */
.ff-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.04fr) minmax(0, .96fr);
  gap: 20px;
  align-items: start;
}

.ff-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.ff-card-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px 20px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.ff-card-head > div { min-width: 0; }
.ff-card-head h2 {
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -.015em;
}
.ff-card-head p {
  margin-top: 1px;
  color: var(--muted);
  font-size: .78rem;
}

.ff-step {
  width: 36px;
  height: 36px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: var(--brand-soft);
  border: 1px solid color-mix(in srgb, var(--brand) 24%, transparent);
  color: var(--brand-deep);
  font-size: .86rem;
  font-weight: 800;
}

.ff-card-body { padding: 18px 20px 20px; }

/* ===== Editor ===== */
.ff-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 12px;
}
.ff-toolbar-spacer { flex: 1 1 0; min-width: 0; }
.ff-toolbar .ff-btn-primary {
  flex: 1 1 100%;
  min-height: 40px;
  margin-top: 2px;
  font-size: .84rem;
}

.ff-editor-shell {
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  background: #0b1220;
}

.ff-editor-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 12px;
  border-bottom: 1px solid #1e293b;
  background: #0f172a;
  color: #94a3b8;
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.ff-editor-bar .ff-char-count {
  letter-spacing: 0;
  text-transform: none;
  font-weight: 600;
  color: #64748b;
  font-variant-numeric: tabular-nums;
}
.ff-char-count.is-over { color: #fca5a5; }

.ff-editor {
  display: block;
  width: 100%;
  min-height: 430px;
  padding: 14px;
  border: 0;
  resize: vertical;
  background: #0b1220;
  color: #e2e8f0;
  font-family: var(--mono);
  font-size: 12.6px;
  line-height: 1.65;
  tab-size: 2;
}
.ff-editor::placeholder { color: #475569; }
.ff-editor:focus-visible { outline: 3px solid var(--brand-ring); outline-offset: -3px; border-radius: 0; }

.ff-status {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-top: 12px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface-soft);
  color: var(--muted);
  font-size: .82rem;
  font-weight: 550;
}
.ff-status::before {
  content: "";
  width: 8px;
  height: 8px;
  flex: none;
  margin-top: 7px;
  border-radius: 50%;
  background: var(--subtle);
}
.ff-status.ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok); }
.ff-status.ok::before { background: var(--ok); }
.ff-status.err { background: var(--danger-bg); border-color: var(--danger-line); color: var(--danger); }
.ff-status.err::before { background: var(--danger); }
.ff-status.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }
.ff-status.warn::before { background: var(--warn); }

.ff-errors {
  max-height: 220px;
  margin: 10px 0 0;
  padding: 0;
  list-style: none;
  overflow: auto;
  font-size: .8rem;
}
.ff-errors:empty { display: none; }
.ff-errors li {
  margin-bottom: 6px;
  padding: 7px 10px;
  border: 1px solid var(--danger-line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--danger);
}
.ff-errors code {
  padding: 1px 5px;
  border-radius: 5px;
  background: var(--danger-bg);
  font-family: var(--mono);
  font-size: .72rem;
}

/* ===== Preview ===== */
.ff-empty {
  padding: 34px 20px;
  border: 1px dashed var(--line-strong);
  border-radius: 12px;
  background: var(--surface-soft);
  color: var(--muted);
  font-size: .85rem;
  text-align: center;
}

.ff-preview-meta { display: grid; gap: 12px; margin-bottom: 14px; }

.ff-field { min-width: 0; }
.ff-field label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: .76rem;
  font-weight: 700;
}
.ff-field input[type=text],
.ff-field textarea,
.ff-field select,
.ff-q input[type=text],
.ff-q textarea,
.ff-q-type {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--page);
  color: var(--text);
  font-size: .86rem;
  padding: 9px 11px;
  transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.ff-field input[type=text]:focus,
.ff-field textarea:focus,
.ff-field select:focus,
.ff-q input[type=text]:focus,
.ff-q textarea:focus,
.ff-q-type:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-ring);
}
.ff-field textarea { min-height: 58px; resize: vertical; }

.ff-settings {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 18px;
  margin-bottom: 14px;
  padding: 11px 13px;
  border: 1px dashed var(--line-strong);
  border-radius: 11px;
  font-size: .8rem;
}
.ff-check {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  color: var(--text);
  font-weight: 550;
}
.ff-check input { accent-color: var(--brand-strong); width: 15px; height: 15px; }

.ff-q {
  margin-bottom: 10px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
}
.ff-q-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.ff-q-num {
  padding: 2px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface-soft);
  color: var(--muted);
  font-size: .68rem;
  font-weight: 800;
}
.ff-q-top > span[aria-hidden] { color: var(--brand-deep); font-size: .9rem; }
.ff-q-type {
  margin-left: auto;
  width: auto;
  padding: 5px 8px;
  font-size: .74rem;
  font-weight: 600;
}
.ff-q input[type=text],
.ff-q textarea { margin-bottom: 7px; }
.ff-q textarea { min-height: 42px; font-size: .8rem; color: var(--muted); }

.ff-opts { display: grid; gap: 6px; margin: 6px 0; }
.ff-opt { display: flex; align-items: center; gap: 6px; }
.ff-opt > span[aria-hidden] { width: 16px; flex: none; color: var(--muted); font-size: .78rem; text-align: center; }
.ff-opt input[type=text] { flex: 1; margin: 0; }
.ff-q-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ff-req {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
  color: var(--muted);
  font-size: .78rem;
  font-weight: 600;
  cursor: pointer;
}
.ff-req input { accent-color: var(--brand-strong); width: 15px; height: 15px; }

.ff-scale-row { display: flex; flex-wrap: wrap; gap: 8px; }
.ff-scale-row .ff-field { flex: 1; min-width: 110px; }

.ff-add-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }

.ff-generate-bar {
  position: sticky;
  bottom: 0;
  margin-top: 14px;
  padding: 10px 0 2px;
  background: linear-gradient(transparent, var(--surface) 32%);
}
.ff-generate-bar .ff-btn-primary {
  width: 100%;
  min-height: 48px;
  border-radius: 12px;
  font-size: .94rem;
  font-weight: 750;
}
.ff-hint {
  margin-top: 8px;
  color: var(--muted);
  font-size: .76rem;
  text-align: center;
}

/* ===== Result ===== */
.ff-result {
  margin-top: 20px;
  padding: 20px;
  border: 1px solid var(--ok-line);
  border-radius: var(--radius);
  background: var(--ok-bg);
  box-shadow: var(--shadow);
  color: var(--text);
}
.ff-result.partial { border-color: var(--warn-line); background: var(--warn-bg); }
.ff-result.failed { border-color: var(--danger-line); background: var(--danger-bg); }
.ff-result h3 { margin-bottom: 5px; font-size: 1.02rem; font-weight: 800; }

.ff-links { display: grid; gap: 9px; margin-top: 12px; }
.ff-link-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.ff-link-row > div { min-width: 0; flex: 1; }
.ff-link-row strong { display: block; font-size: .76rem; }
.ff-link-row a { display: block; font-size: .78rem; overflow-wrap: anywhere; }

/* ===== How-to / FAQ ===== */
.ff-howto { margin-top: 22px; }
.ff-howto ol {
  margin: 0 0 14px;
  padding-left: 20px;
  color: var(--muted);
  font-size: .88rem;
}
.ff-howto li { margin-bottom: 6px; }
.ff-howto li strong { color: var(--text); }
.ff-prompt-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
.ff-prompt-box {
  max-height: 250px;
  overflow: auto;
  padding: 14px;
  border-radius: 11px;
  background: #0b1220;
  color: #cbd5e1;
  font-family: var(--mono);
  font-size: 11.8px;
  line-height: 1.65;
  white-space: pre-wrap;
}

.ff-faq-wrap {
  margin-top: 22px;
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.ff-section-heading { margin-bottom: 10px; }
.ff-section-heading h2 { font-size: 1.15rem; font-weight: 800; letter-spacing: -.02em; }
.ff-faq-wrap details { border-top: 1px solid var(--line); }
.ff-faq-wrap details:first-of-type { border-top: 0; }
.ff-faq-wrap summary {
  padding: 12px 2px;
  font-size: .86rem;
  font-weight: 700;
  cursor: pointer;
}
.ff-faq-wrap summary::marker { color: var(--brand-strong); }
.ff-faq-wrap details p {
  padding: 0 2px 14px;
  color: var(--muted);
  font-size: .84rem;
}

.ff-footer {
  width: min(100% - 48px, 1180px);
  margin: 0 auto;
  padding: 20px 0 28px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: .76rem;
  text-align: center;
}
.ff-footer a { color: var(--brand-strong); font-weight: 700; text-decoration: none; }
.ff-footer a:hover { text-decoration: underline; }

/* ===== Modal + toast ===== */
.ff-modal-back {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: none;
  place-items: center;
  padding: 16px;
  background: rgba(8, 15, 28, .5);
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
}
.ff-modal-back.open { display: grid; }
.ff-modal {
  width: 100%;
  max-width: 560px;
  max-height: 86vh;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-lg);
}
.ff-modal-head {
  display: flex;
